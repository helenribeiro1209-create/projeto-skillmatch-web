<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Gestão de vagas e compatibilidade entre candidatos e oportunidades"
    />

    <link rel="stylesheet" href="./assets/styles/index.style.css" />

    <title>Vagas Skillmatch Web</title>
  </head>

  <body>
    <header>
      <h1>Vagas Skillmatch Web</h1>
    </header>

    <main>
      <form id="form-cadastro">
        <!-- DADOS PESSOAIS -->
        <section>
          <h2>Dados pessoais</h2>

          <div>
            <label for="name">Nome:</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Digite seu nome"
              autocomplete="name"
              required
            />
          </div>

          <div>
            <label for="email">E-mail:</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu e-mail"
              autocomplete="email"
              required
            />
          </div>
        </section>

        <!-- PERFIL PROFISSIONAL -->
        <section>
          <h2>Perfil profissional</h2>

          <div>
            <label for="interest-area"> Área de interesse: </label>

            <input
              type="text"
              id="interest-area"
              name="interestArea"
              placeholder="Ex.: Desenvolvimento Web"
              required
            />
          </div>

          <div>
            <label for="position"> Cargo desejado: </label>

            <input
              type="text"
              id="position"
              name="position"
              placeholder="Ex.: Desenvolvedor Front-end"
              required
            />
          </div>

          <div>
            <label for="skills"> Habilidades: </label>

            <textarea
              id="skills"
              name="skills"
              placeholder="Ex.: JavaScript, HTML, CSS"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="paralel-fields">
            <div>
              <label for="experience-time"> Tempo de experiência: </label>

              <input
                type="number"
                id="experience-time"
                name="experienceTime"
                min="0"
                step="0.5"
                placeholder="Ex.: 1 anos"
                required
              />
            </div>

            <div>
              <label for="education"> Formação: </label>

              <input
                type="text"
                id="education"
                name="education"
                placeholder="Ex.: Ensino superior em andamento"
                required
              />
            </div>
          </div>
        </section>

        <!-- LOCALIZAÇÃO -->
        <section>
          <h2>Localização</h2>

          <div class="paralel-fields">
            <div>
              <label for="state"> Estado: </label>

              <input
                type="text"
                id="state"
                name="state"
                placeholder="Ex.: SC"
                maxlength="2"
                autocomplete="address-level1"
                required
              />
            </div>

            <div>
              <label for="city"> Cidade: </label>

              <input
                type="text"
                id="city"
                name="city"
                placeholder="Ex.: Blumenau"
                autocomplete="address-level2"
                required
              />
            </div>
          </div>
        </section>

        <!-- MENSAGEM DO FORMULÁRIO -->
        <div id="form-message" role="alert" aria-live="polite"></div>

        <!-- AÇÕES -->
        <div>
          <button type="reset">Limpar</button>

          <button type="submit">Buscar Vagas</button>
        </div>

        <!-- RESULTADOS -->
        <section aria-labelledby="resultados-title">
          <h2 id="resultados-title">Vagas compatíveis</h2>

          <div id="vagas-container" aria-live="polite"></div>
        </section>
      </form>
    </main>

    <script type="module" src="./assets/scripts/index.script.js"></script>
  </body>
</html>
